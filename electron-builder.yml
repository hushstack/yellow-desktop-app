appId: com.yello.desktop
productName: Yello
copyright: Copyright © 2026 Yello

directories:
  output: release
  buildResources: build

# asar keeps app sources in a single archive: faster cold start and fewer loose files.
asar: true
files:
  - dist/**/*
  - dist-electron/**/*
  - package.json

electronLanguages:
  - en-US

mac:
  category: public.app-category.social-networking
  target:
    - dmg
    - zip
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  icon: build/icons/icon.png

win:
  target:
    - nsis
  icon: build/icons/icon.png

linux:
  target:
    - AppImage
    - deb
  category: Network
  icon: build/icons/icon.png

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true

# Update artifacts are signature-checked by electron-updater before they are applied
# (OWASP A08). Fill in a publish provider before enabling releases.
publish: null
